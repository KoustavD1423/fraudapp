name: CI

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FraudPlatform.sln

      - name: Build
        run: dotnet build FraudPlatform.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FraudPlatform.sln --configuration Release --no-build
